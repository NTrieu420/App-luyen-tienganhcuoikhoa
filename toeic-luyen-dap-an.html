body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}

.tb{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:12px 10px;text-align:left}

select{font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:8px;padding:5px 8px}

.go>div{max-width:760px;margin:0 auto}

.ctl{display:flex;gap:10px;margin-top:16px}
.ctl .cta{flex:1}.ctl .sec{background:var(--card);color:var(--ink);border:1.5px solid var(--rule)}
.score{font-family:var(--serif);font-size:72px;line-height:1;margin:10px 0 4px}
.rs{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.stack{display:grid;gap:10px;margin-top:22px}
@media(max-width:520px){.tests{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const pick=()=>{let l=base().filter(POOL[cfg.pool]);if(cfg.shuf)l=l.sort(()=>Math.random()-.5);return cfg.n?l.slice(0,cfg.n):l};
const mastered=t=>ALL.filter(x=>(t==='all'||x.t===t)&&S[x.k]&&S[x.k].b>=4).length;
const fmt=ms=>ms<DAY?'sau vài phút':'sau '+Math.round(ms/DAY)+' ngày';

  if(ses.review)ctl=`<button class="cta sec" data-a="prev" ${ses.i?'':'disabled'}>Câu trước</button><button class="cta sec" data-a="next" ${last?'disabled':''}>Câu sau</button><button class="cta" data-a="result">Xong</button>`;
  else if(ex)ctl=`<button class="cta sec" data-a="prev" ${ses.i?'':'disabled'}>Câu trước</button><button class="cta sec" data-a="next" ${last?'disabled':''}>Câu sau</button><button class="cta" data-a="submit">${ses.warn?'Còn '+un+' câu trống, vẫn nộp':'Nộp bài'}</button>`;
  else ctl=show?`<button class="cta" data-a="next">${last?'Xem kết quả':'Câu tiếp'}</button>`:`<button class="cta sec" data-a="peek">Xem đáp án</button>`;
  const done=Object.keys(ses.ans).length;
  app.innerHTML=`<div class="sbar"><button class="ghost" data-a="exit">Thoát</button><span class="sp"></span>${ex?'<span id="tm">00:00</span>':''}<span><b>${ses.i+1}</b> / ${ses.q.length}</span></div>
  <div class="strip">${strip}</div>
  <div class="qc"><div class="meta"><span>${TN[it.t]} · Câu ${it.id} · ${secOf(it.id)[1]}</span>${/graphic/i.test(it.q)?'<span class="miss">Đề gốc thiếu hình</span>':''}<button class="st ${r.s?'on':''}" data-a="star" aria-label="Đánh dấu câu này">${r.s?'★':'☆'}</button></div>
  <p class="qt">${esc(it.q)}</p>${opts}${fb}</div><div class="ctl">${ctl}</div>`;
  if(ex)tick();
}
function finishExam(){clearInterval(timer);ses.q.forEach(x=>{rec(x,ses.ans[x.ak]===x.a)});ses.done=true;result()}
function result(){
  clearInterval(timer);const o=ses.q.filter(x=>x.ak===x.k),ok=o.filter(x=>ses.ans[x.ak]===x.a),bad=o.filter(x=>ses.ans[x.ak]!==x.a),p=Math.round(ok.length/o.length*100);
  const rows=SEC.map(s=>{const g=o.filter(x=>secOf(x.id)===s);return g.length?`<div class="rs"><span>${s[1]}</span><b>${g.filter(x=>ses.ans[x.ak]===x.a).length}/${g.length}</b></div>`:''}).join('');
  ses.bad=bad;
  app.innerHTML=`<div class="top"><span class="logo">Kết quả</span></div><div class="score">${p}%</div><p class="lead">Đúng ${ok.length} trên ${o.length} câu${ses.mode==='exam'?', mất '+Math.floor((now()-ses.t0)/6e4)+' phút':''}.</p>${rows}
  <div class="stack">${bad.length?`<button class="cta" data-a="wrongs">Luyện lại ${bad.length} câu sai</button>`:''}<button class="cta sec" style="background:var(--card);color:var(--ink);border:1.5px solid var(--rule)" data-a="review">Xem lại từng câu</button><button class="cta sec" style="background:var(--card);color:var(--ink);border:1.5px solid var(--rule)" data-a="home">Về trang chủ</button></div>`;scrollTo(0,0)
}
function answer(l){const it=ses.q[ses.i];if(ses.mode==='exam'){if(!ses.review){ses.ans[it.ak]=l;ses.warn=false;play()}return}
  if(ses.ans[it.ak]!==undefined)return;ses.ans[it.ak]=l;const ok=l===it.a;if(it.ak===it.k)rec(it,ok);if(!ok&&!ses.rq[it.k]){ses.rq[it.k]=1;ses.q.push({...it,ak:it.k+'#2'})}play()}
function go(d){const j=ses.i+d;if(j>=0&&j<ses.q.length){ses.i=j;play();scrollTo(0,0)}}
function act(a,v,el){
  switch(a){
    case'test':cfg.test=v;return home();
    case'sec':cfg.secs.has(v)?cfg.secs.size>1&&cfg.secs.delete(v):cfg.secs.add(v);return home();
    case'pool':cfg.pool=v;return home();case'mode':cfg.mode=v;return home();
    case'shuf':cfg.shuf=el.checked;return;case'n':cfg.n=+el.value;return home();
    case'theme':{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark';return}
    case'start':return begin(pick());
    case'pick':return answer(v);
    case'peek':{const it=ses.q[ses.i];ses.ans[it.ak]='?';if(it.ak===it.k)rec(it,false);if(!ses.rq[it.k]){ses.rq[it.k]=1;ses.q.push({...it,ak:it.k+'#2'})}return play()}
    case'next':if(ses.i===ses.q.length-1)return result();return go(1);
    case'prev':return go(-1);case'goto':ses.i=+v;return play();
    case'star':{const it=ses.q[ses.i],r=S[it.k]||(S[it.k]={b:0,n:0,w:0,d:now()});r.s=!r.s;save();return play()}
    case'submit':{const un=ses.q.filter(x=>ses.ans[x.ak]===undefined).length;if(un&&!ses.warn){ses.warn=true;return play()}return finishExam()}
    case'review':ses.review=true;ses.q=ses.q.filter(x=>x.ak===x.k);ses.i=0;return play();
    case'wrongs':return begin(ses.bad.map(x=>({...x,ak:x.k})));
    case'result':return result();
    case'exit':if(ses&&ses.mode==='exam'&&!ses.review&&!confirm('Thoát sẽ bỏ bài thi đang làm. Thoát?'))return;
    case'home':clearInterval(timer);ses=null;return home();
  }
}
app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&el.tagName!=='INPUT'&&el.tagName!=='SELECT')act(el.dataset.a,el.dataset.v,el)});
app.addEventListener('change',e=>{const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset.v,el)});
document.addEventListener('keydown',e=>{if(!ses||ses.done&&!ses.review||/select|input/i.test(e.target.tagName)||!document.querySelector('.qc'))return;const k=e.key.toLowerCase(),it=ses.q[ses.i];
  if('abcd'.includes(k)&&k.length===1||'1234'.includes(k)&&k.length===1)answer('ABCD'['abcd'.includes(k)?'abcd'.indexOf(k):+k-1]);
  else if(k==='arrowright'||k==='enter'||k===' '){e.preventDefault();const my=ses.ans[it.ak];if(ses.mode==='exam'||ses.review||my!==undefined)act('next');else if(k!=='arrowright')act('peek')}
  else if(k==='arrowleft')go(-1);else if(k==='s')act('star')});
home();
</script>
</body>
</html>
